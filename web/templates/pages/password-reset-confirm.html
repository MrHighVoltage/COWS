{{ define "password-reset-confirm-page" }}
{{ template "base-start" . }}
<section class="narrow-section" aria-labelledby="reset-confirm-title">
  <p class="eyebrow">Account security</p>
  <h1 id="reset-confirm-title">Choose a new password</h1>
  {{ if .PasswordReset.Error }}<p class="alert alert-error" role="alert">{{ .PasswordReset.Error }}</p>{{ end }}
  <form class="form-panel" method="post" action="/password/reset/confirm">
    <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
    <input type="hidden" name="token" value="{{ .PasswordReset.Token }}">
    <label for="reset-new-password">New password</label>
    <input id="reset-new-password" name="new_password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required autofocus>
    <label for="reset-confirm-password">Confirm new password</label>
    <input id="reset-confirm-password" name="confirm_password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required>
    <button class="primary-button" type="submit">Change password</button>
  </form>
</section>
{{ template "base-end" . }}
{{ end }}
