{{ define "workspace-new-page" }}
{{ template "base-start" . }}
<section class="narrow-section" aria-labelledby="workspace-new-title">
  <p class="eyebrow">Workspace access</p>
  <h1 id="workspace-new-title">Create workspace</h1>
  {{ if .Workspace.Error }}<p class="alert alert-error" role="alert">{{ .Workspace.Error }}</p>{{ end }}
  <form class="form-panel" method="post" action="/workspaces">
    <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
    <label for="workspace-name">Workspace name</label>
    <input id="workspace-name" name="name" type="text" value="{{ .Workspace.Name }}" maxlength="100" required autofocus>
    <label for="workspace-template">Approved template</label>
    <select id="workspace-template" name="template_id" required>
      <option value="">Select a template</option>
      {{ range .Templates }}<option value="{{ .ID }}"{{ if eq .ID $.Workspace.TemplateID }} selected{{ end }}>{{ .Name }}</option>{{ else }}<option value="" disabled>No templates available</option>{{ end }}
    </select>
    <div class="form-actions"><a class="secondary-button button-link" href="/workspaces">Cancel</a><button class="primary-button" type="submit">Create workspace</button></div>
  </form>
</section>
{{ template "base-end" . }}
{{ end }}
