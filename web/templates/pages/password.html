{{ define "password-page" }}
{{ template "base-start" . }}
<section class="narrow-section" aria-labelledby="password-title">
  <p class="eyebrow">Account security</p>
  <h1 id="password-title">Change your password</h1>
  <p class="lede">A new password is required before you can continue.</p>
  {{ if .Password.Error }}<p class="alert alert-error" role="alert">{{ .Password.Error }}</p>{{ end }}
  <form class="form-panel" method="post" action="/account/password">
    <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
    <label for="current-password">Current password</label>
    <input id="current-password" name="current_password" type="password" autocomplete="current-password" required autofocus>
    <label for="new-password">New password</label>
    <input id="new-password" name="new_password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required>
    <label for="confirm-password">Confirm new password</label>
    <input id="confirm-password" name="confirm_password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required>
    <button class="primary-button" type="submit">Change password</button>
  </form>
</section>
{{ template "base-end" . }}
{{ end }}
