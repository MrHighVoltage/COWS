{{ define "health-status" }}
<div id="health-status" class="status-row" role="status" aria-live="polite">
  <div>
    <span class="status-label">COWS server</span>
    <strong class="status-value status-{{ .Status }}">{{ .Status }}</strong>
  </div>
  <div>
    <span class="status-label">SQLite</span>
    <strong class="status-value status-{{ .Database }}">{{ .Database }}</strong>
  </div>
  <time datetime="{{ .CheckedAt }}">Checked {{ .CheckedAt }}</time>
  <button class="primary-button" type="button" hx-get="/fragments/health" hx-target="#health-status" hx-swap="outerHTML">Refresh status</button>
</div>
{{ end }}
