{{ define "state-stamp" }}{{ if eq . "running" }}<span class="status-stamp status-ok">{{ . }}</span>{{ else if eq . "created" }}<span class="status-stamp status-neutral">{{ . }}</span>{{ else if eq . "stopped" }}<span class="status-stamp status-neutral">{{ . }}</span>{{ else if eq . "exited" }}<span class="status-stamp status-disabled">{{ . }}</span>{{ else if eq . "removed" }}<span class="status-stamp status-disabled">{{ . }}</span>{{ else if eq . "failed" }}<span class="status-stamp status-disabled">{{ . }}</span>{{ else }}<span class="status-stamp status-warning">{{ . }}</span>{{ end }}{{ end }}
